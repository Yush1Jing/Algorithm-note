# Project information
site_name: Algorithm Notes
site_url: https://yush1jing.github.io/Algorithm-note/
site_author: Yush1Jing
site_description: 数据结构与算法学习笔记：套路、模板与刷题复盘

# Repository
repo_name: Yush1Jing/Algorithm-note
repo_url: https://github.com/Yush1Jing/Algorithm-note
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Yush1Jing

theme:
  name: material
  custom_dir: overrides
  language: zh
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/theme-light-dark
        name: 深色模式
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/theme-light-dark
        name: 浅色模式
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
    edit: fontawesome/regular/pen-to-square

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Yush1Jing
  generator: false
  status:
    new: 最近添加

plugins:
  - search:
      lang:
        - zh
        - en
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: none
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      auto_caption: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 第 0 章 前言:
      - 00-preface/index.md
  - 第 1 章 数据结构:
      - 01-data-structures/index.md
  - 附录:
      - 笔记模板: appendix/template.md
